name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Design-token contrast gate (§8.3): fails if a tokens.css edit drops
      # any required color-text combination below WCAG 2.2 AA.
      - run: npm run contrast --workspace=@lms/ui
      - run: npm run build
      # Low-bandwidth budget (Texnik topshiriq §13): initial JS <= 170 KB gzipped.
      - name: Check bundle budget
        run: |
          TOTAL=$(find apps/learner/dist/assets -name "index-*.js" -exec sh -c 'gzip -c "$1" | wc -c' _ {} \; | awk '{s+=$1} END {print s}')
          echo "Initial JS (gzipped): $TOTAL bytes"
          if [ "$TOTAL" -gt 174080 ]; then
            echo "::error::Initial bundle exceeds 170 KB gzip budget"
            exit 1
          fi
