server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets are immutable — cache aggressively (low-bandwidth §13).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback; index.html must revalidate so deploys propagate.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
